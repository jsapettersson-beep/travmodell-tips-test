<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travmodell 2.0 – Tipstest</title><style>body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#162332;max-width:760px;margin:24px auto;padding:14px}section{background:white;border-radius:14px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;box-sizing:border-box}input{width:100%;margin:8px 0}button{border:0;border-radius:8px;background:#1766a7;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:12px;border-radius:8px}small{color:#526273}</style></head><body>
<h1>Travmodell 2.0 – Tipshämtning</h1><p>Säkert test av mellananalysens tipshämtning. Inga analyslåsningar eller tips sparas.</p>
<section><h2>1. Inloggning</h2><input id="email" type="email" placeholder="E-post i Supabase Auth" autocomplete="email"><button id="login">Skicka inloggningslänk</button> <button id="logout" hidden>Logga ut</button><p id="status">Kontrollerar inloggning…</p></section>
<section><h2>2. Läs-test</h2><label for="race">Testloppets ID</label><input id="race" value="6b48b6d3-1ad9-4054-8f72-b74d503b9178"><button id="run" disabled>Testa startkedjan (endast läsning)</button><label style="display:block;margin:14px 0"><input type="checkbox" id="test_missing_source" style="width:auto"> Simulera en felande tipskälla</label><p><small>Historiskt testlopp. Förväntat: förhandsgranskning, inga låsningar och inget skrivande.</small></p><pre id="result">Väntar på inloggning.</pre></section>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const key='sb_publishable_GQs9L0B5nDHiCl914PHUHA_wGjdX3nE';
const supabase=createClient('https://kdorqppajsaqidsvtcaa.supabase.co',key);
const $=id=>document.getElementById(id), url='https://kdorqppajsaqidsvtcaa.supabase.co/functions/v1/trav-middle-manual-start-v1';
async function check(){const {data:{user},error}=await supabase.auth.getUser();$('status').textContent=error?'Inloggningskontroll: '+error.message:user?'Inloggad och redo':'Inte inloggad';$('run').disabled=!user;$('logout').hidden=!user}
$('login').onclick=async()=>{const email=$('email').value.trim();if(!email){$('status').textContent='Ange din e-postadress';return}const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('status').textContent=error?error.message:'Kontrollera din e-post för inloggningslänken'};
$('logout').onclick=async()=>{await supabase.auth.signOut();await check()};
$('run').onclick=async()=>{const id=$('race').value.trim();if(!/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(id)){$('result').textContent='Ogiltigt lopp-ID';return}const {data:{session}}=await supabase.auth.getSession();if(!session){$('result').textContent='Logga in först';return}$('run').disabled=true;$('result').textContent='Testar…';try{const response=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({race_id:id,test_missing_source:$('test_missing_source').checked})});const raw=await response.text();let parsed;try{parsed=JSON.parse(raw)}catch{parsed={response:raw.slice(0,2000)}}$('result').textContent='HTTP '+response.status+'\n'+JSON.stringify(parsed,null,2)}catch(e){$('result').textContent='Anropet misslyckades: '+e.message+'\nKontrollera CORS och inloggning.'}finally{$('run').disabled=false}};
supabase.auth.onAuthStateChange(()=>setTimeout(check,0));await check();
</script></body></html>
